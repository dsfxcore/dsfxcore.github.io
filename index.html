<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>dsfx.core/</title>
  <link rel="icon" type="image/png" href="assets/favicon.png" />
  <link rel="stylesheet" href="style.css" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,wght@0,300;0,400;0,500;1,300&family=Syne:wght@400;500;600;700&display=swap" rel="stylesheet" />
</head>
<body>

  <!-- INTRO SCREEN — click anywhere to enter + unlock audio -->
  <div id="intro-screen">
    <span id="intro-text">hello</span>
    <span id="intro-hint">click anywhere</span>
  </div>

  <!-- BACKGROUND LAYERS -->
  <div id="bg-video-wrap">
    <video id="bg-video" autoplay muted loop playsinline>
      <source src="assets/background.mp4" type="video/mp4" />
    </video>
  </div>
  <canvas id="nfs-canvas"></canvas>

  <!-- COLOR PICKER BUTTON -->
  <div id="color-btn-wrap">
    <button id="color-toggle-btn" title="Change accent color">◈</button>
    <div id="color-panel">
      <span class="panel-label">Accent</span>
      <div class="swatch-row">
        <button class="swatch" data-color="#ffffff" style="background:#ffffff"></button>
        <button class="swatch" data-color="#ff6b6b" style="background:#ff6b6b"></button>
        <button class="swatch" data-color="#ffd93d" style="background:#ffd93d"></button>
        <button class="swatch" data-color="#6bcb77" style="background:#6bcb77"></button>
        <button class="swatch" data-color="#4d96ff" style="background:#4d96ff"></button>
        <button class="swatch" data-color="#c77dff" style="background:#c77dff"></button>
        <button class="swatch" data-color="#ff9a3c" style="background:#ff9a3c"></button>
        <button class="swatch" data-color="#00f5d4" style="background:#00f5d4"></button>
      </div>
      <label class="hex-label">
        <span>#</span>
        <input type="text" id="hex-input" maxlength="6" placeholder="fafafa" />
      </label>
      <button id="hex-apply">Apply</button>
    </div>
  </div>

  <!-- MAIN CARD -->
  <main id="main-card">

    <!-- AVATAR + NICK -->
    <div class="avatar-wrap">
      <img id="avatar-img" src="assets/pfp.png" alt="avatar"
           onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><rect width=%22100%22 height=%22100%22 rx=%2250%22 fill=%22%23222%22/><text x=%2250%22 y=%2262%22 font-size=%2240%22 text-anchor=%22middle%22 fill=%22%23555%22>✦</text></svg>'" />
    </div>
    <div class="nick-wrap">dsfxcore</div>

    <!-- STATUS BADGE -->
    <div class="status-box">
      <span class="trans-flag" aria-label="transgender flag">
        <!-- Transgender flag: blue / pink / white / pink / blue -->
        <svg width="26" height="18" viewBox="0 0 26 18" xmlns="http://www.w3.org/2000/svg" style="display:block;border-radius:2px">
          <rect width="26" height="3.6" y="0"    fill="#55CDFC"/>
          <rect width="26" height="3.6" y="3.6"  fill="#F7A8B8"/>
          <rect width="26" height="3.6" y="7.2"  fill="#FFFFFF"/>
          <rect width="26" height="3.6" y="10.8" fill="#F7A8B8"/>
          <rect width="26" height="3.6" y="14.4" fill="#55CDFC"/>
        </svg>
      </span>
      <span class="she-her">she/her</span>
    </div>

    <!-- BACKGROUND AUDIO (hidden) -->
    <audio id="bg-audio" loop></audio>

    <!-- LOCAL MUSIC WIDGET (background track player) -->
    <div class="music-widget" id="music-widget">
      <img id="track-cover" src="assets/cover.png" alt="cover"
           onerror="this.src='data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 60 60%22><rect width=%2260%22 height=%2260%22 rx=%226%22 fill=%22%23222%22/><text x=%2230%22 y=%2237%22 font-size=%2222%22 text-anchor=%22middle%22 fill=%22%23444%22>♪</text></svg>'" />
      <div class="track-info">
        <!-- Edit these two lines to set track name/artist -->
        <div class="track-name" id="track-name">Induction Kit (Exotic Theme)</div>
        <div class="track-artist" id="track-artist">Ekstrak</div>
      </div>
      <button id="play-pause-btn" title="Play / Pause">▶</button>
    </div>

    <!-- SOCIAL ICONS -->
    <nav class="social-nav">

    </nav>

  </main>

  <!-- QUOTES -->
  <div id="quotes-wrap">
    <p id="quote-text"></p>
  </div>

  <script src="main.js"></script>
</body>
</html>
